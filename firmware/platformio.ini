; Board builds. Unit tests do NOT run through PlatformIO: the core is plain
; C++17 with no Arduino.h, so it builds under CMake on the host (CMakeLists.txt)
; and the tests run there. Neither build knows about the other.

[platformio]
default_envs = esp32
; The board build compiles src/ beside the portable core, the board's HAL and
; the vendored nanopb runtime.
src_dir = .

[env]
framework = arduino
; No lib_deps. nanopb is vendored in third_party/ at exactly the version
; core/proto/ was generated with, so the board, the host tests and a checkout
; with no network all build the same runtime.
build_src_filter = +<src/> +<core/> +<hal/> +<third_party/nanopb/>
build_flags = -std=gnu++17 -Wall -Wextra
  -Icore -Icore/proto -Ithird_party/nanopb
  ; The version hello_ack reports. A bare `pio run` leaves it empty and the
  ; board reports 0.0.0.
  '-DMOUSEWHEELD_FIRMWARE_VERSION="${sysenv.MOUSEWHEELD_FIRMWARE_VERSION}"'
build_unflags = -std=gnu++11

; Classic ESP32 (WROOM-32): PCNT and the built-in DAC. The S3 and C3 have no DAC
; and are not this env.
[env:esp32]
platform = espressif32
board = esp32dev
monitor_speed = 1000000
build_flags = ${env.build_flags}
  '-DMOUSEWHEELD_BOARD_NAME="esp32-wroom32"'
  -DMOUSEWHEELD_BAUD=1000000
