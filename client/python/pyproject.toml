[project]
name = "mousewheeld-client"
description = "Python client for mousewheeld — the locomotion daemon's API, as types"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Joscha Schmiedt" }]
requires-python = ">=3.12"

# NOT the version of anything shipped — a deliberately invalid sentinel, as in
# vstimd and triald. The real version comes from the git tag and is stamped in
# at build time; a 0.0.0 artifact means the stamping was bypassed.
version = "0.0.0"

# Two, and both are runtime. `grpcio` is the transport and `protobuf` is the
# generated types it carries; the stubs are committed, so `grpcio-tools` and
# protoc are a development dependency and not an installation one
# (`contracts/DAEMON_LAYOUT.md`).
dependencies = [
    "grpcio>=1.66",
    "protobuf>=5.27",
]

[project.scripts]
mousewheelctl = "mousewheeld_client.command_line_interface:main"

[dependency-groups]
dev = [
    "grpcio-tools>=1.66",
    "pytest>=8.3",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mousewheeld_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.src]
# The generated stubs are not hand-written and not reviewed as source; they are
# checked by being used, and everything that touches them is `_convert.py`.
exclude = ["mousewheeld_client/_proto"]
