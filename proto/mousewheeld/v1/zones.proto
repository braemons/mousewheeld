syntax = "proto3";

package mousewheeld.v1;

import "google/protobuf/struct.proto";
import "mousewheeld/v1/device.proto";

// Distances at which a line fires.
//
// **Zones are dynamic; the lines they drive are not.** A zone set names
// `"line": "zone_goal"` and never a pin, so one set runs on every rig that has
// a `zone_goal` line and a rewired rig edits one file.
//
// **Authored in centimetres, compiled to counts.** The firmware has no
// floating point on any path whose result crosses the wire, so the host turns
// every centimetre into an integer interval before the board sees it — against
// a named calibration, which is why changing the calibration marks compiled
// sets stale.
service Zones {
  // The names in the store.
  rpc ListZoneSets(ListZoneSetsRequest) returns (ZoneSetNames);

  // One stored set, exactly as it is on disk.
  rpc ReadZoneSet(ZoneSetName) returns (ZoneSet);

  // Store a set. Refused if it does not parse or does not compile.
  rpc ReplaceZoneSet(WriteZoneSet) returns (ZoneSet);

  // Compile a **draft** — what somebody is typing, before it is saved.
  //
  // The body goes through the daemon's own deserializer and compiler, so what
  // comes back is the refusal the real thing would give. There is no second,
  // looser description of a zone set in a browser to disagree with it.
  rpc ValidateDraft(ZoneSet) returns (ValidationReport);

  // Compile the set as it is **stored** — "is that one still good after the
  // calibration changed".
  rpc ValidateZoneSet(ZoneSetName) returns (ValidationReport);

  // The JSON Schema of a zone set **file**, for an editor or a checker.
  //
  // Not the schema of `ZoneSet` above — that one is this file, and a client
  // generates from it. This is the stored spelling: `"$goal_cm"` for a
  // reference, `"displacement"` for a metric, which is what somebody has open
  // in an editor. Arbitrary JSON, so it is carried as such.
  //
  // Committed in this repository as well, at
  // `docs/reference/zone-set.schema.json`, because an editor and CI must reach
  // it without a daemon running.
  rpc ReadZoneSetSchema(ReadZoneSetSchemaRequest) returns (google.protobuf.Struct);

  // What is armed, what fired, and where.
  rpc ReadArmed(ReadArmedRequest) returns (ArmedZones);

  // Resolve the patch, compile against the calibration in force, upload, and
  // wait for the board to answer `armed`.
  //
  // Refuses when the set does not fit, naming what overflowed; refuses a
  // `$name` the patch does not carry, naming the name. Never a default — a
  // goal distance that silently became zero is a trial that looks like it ran.
  rpc Arm(ArmRequest) returns (ArmedZones);

  rpc Disarm(DisarmRequest) returns (ArmedZones);

  // Write what is armed to the board's flash, so a standalone rig comes up
  // with its zones. Refuses `nothing_armed`.
  rpc SaveToFlash(SaveToFlashRequest) returns (DeviceInfo);
}

message ZoneSetNames {
  repeated string zone_sets = 1 [json_name = "zone_sets"];
}

// A set's name in the store. A path parameter, never a body.
message ZoneSetName {
  string name = 1;
}

message WriteZoneSet {
  string name = 1;
  ZoneSet zone_set = 2 [json_name = "zone_set"];
}

// A named set, as the API carries it.
//
// **The file on disk is a storage format, not this.** A stored zone set keeps
// its own spelling — a bound written `"$goal_cm"`, a metric written
// `"displacement"` — because somebody edits it in a text editor and reviews it
// in a diff, and `docs/reference/zone-set.schema.json` is its schema. The
// daemon converts at the same seam it converts everything else, exactly as it
// does for the TOML rig config.
//
// This was carried as an opaque document at first, to keep one spelling for
// both. That put the one part of the API a client most wants to construct
// beyond the reach of a type, and a schema for it in a second file. The public
// interface is defined in one place and strongly typed, or it is not; the file
// keeps its own shape and the daemon pays for the difference.
//
// Declaration order resolves two zones firing in one scan: both still fire,
// and the order is the order of their `zone_hit` messages.
message ZoneSet {
  // A URL for this set's JSON Schema, carried so an editor can validate the
  // *file* as somebody types it. Stored as `$schema`; named for what it is
  // here, since a leading `$` is a JSON-editor convention and not a field name.
  //
  // It exists because the file refuses unknown fields: without somewhere to put
  // it, the one line that makes a hand-edited file checkable would itself be a
  // refusal.
  optional string schema_url = 1 [json_name = "schema_url"];

  // Bumped by whoever edits the set. The board reports the version it holds, so
  // "is the board running what I think it is" is one comparison.
  uint32 zone_set_version = 2 [json_name = "zone_set_version"];

  repeated Zone zones = 3;
}

message Zone {
  string name = 1;
  ZoneShape shape = 2;

  // The axes this zone constrains, in the order its bounds are given. One for a
  // wheel; a 2-D rectangle on a ball is already expressible.
  repeated string axes = 3;

  ZoneMetric metric = 4;

  // The low end per axis, in the order of `axes`.
  repeated ZoneBound min_cm = 5 [json_name = "min_cm"];

  // The high end per axis.
  repeated ZoneBound max_cm = 6 [json_name = "max_cm"];

  // A circular track: the metric is evaluated modulo this period.
  optional double wrap_cm = 7 [json_name = "wrap_cm"];

  FireRule fire = 8;

  optional double hysteresis_cm = 9 [json_name = "hysteresis_cm"];

  // Fire on arming if the animal is already inside. Off by default: a zone
  // fires on the false→true **edge** of "inside", so arming a zone somebody is
  // standing in does not fire it.
  bool level = 10;

  ZoneOutput output = 11;
}

// One end of a zone's interval on one axis.
//
// Three things, and they are not interchangeable: a number, an **open** bound
// (neither arm set — "everything past here"), and a **reference** to a
// per-trial value resolved from the patch given at arm time.
//
// A reference that reaches the compiler unresolved is a refusal naming the
// name, never a zero: a goal distance that silently became zero is a trial that
// looks like it ran. The board never sees a reference; substitution happens
// host-side, before compilation.
message ZoneBound {
  oneof bound {
    double value = 1;
    // The name without its `$`. The file writes `"$goal_cm"`; the sigil is the
    // file's way of telling a number from a name in one JSON position, and the
    // oneof is this interface's.
    string reference = 2;
  }
}

message ZoneOutput {
  // A **name** from the rig config's line map, never a pin number.
  string line = 1;

  OutputAction action = 2;

  // Pulse width. Ignored by a `level` output.
  optional uint32 ms = 3;
}

// The only shape today, and a discriminator rather than a flag: a future
// `circle` or `polygon` is a new value, and a shape the firmware does not know
// is refused whole rather than half-evaluated.
enum ZoneShape {
  ZONE_SHAPE_UNSPECIFIED = 0;
  ZONE_SHAPE_RECT = 1;
}

// Which quantity a zone is compared against.
enum ZoneMetric {
  // Omitted. Treated as `DISPLACEMENT`, because a corridor is what a wheel
  // usually drives.
  ZONE_METRIC_UNSPECIFIED = 0;
  // Signed, `counts − origin`. What a corridor position is.
  ZONE_METRIC_DISPLACEMENT = 1;
  // Direction-free odometer, `Σ |Δcounts|`. What "how much did it run" is.
  ZONE_METRIC_DISTANCE = 2;
}

// What happens after a zone fires.
enum FireRule {
  FIRE_RULE_UNSPECIFIED = 0;
  // Disarm after firing.
  FIRE_RULE_ONCE = 1;
  // Re-arm once the position has left the zone by `hysteresis_cm`, so encoder
  // jitter at a boundary is not a pulse train.
  FIRE_RULE_REARM = 2;
}

// How the line behaves while the condition holds.
enum OutputAction {
  OUTPUT_ACTION_UNSPECIFIED = 0;
  // High for at most `ms`.
  OUTPUT_ACTION_PULSE = 1;
  // High while inside, with the same hysteresis.
  OUTPUT_ACTION_LEVEL = 2;
}

message ArmRequest {
  // A name from the store. Never a slot: the daemon holds the sets, and a name
  // it does not have is a configuration error the caller can report.
  string zone_set = 1 [json_name = "zone_set"];

  // Per-trial values for this set's `$name` bounds.
  map<string, double> patch = 2;

  ArmOrigin origin = 3;

  // Opaque text stored with the arm — triald writes `trial 42`. The daemon
  // stays trial-blind and hands it back unread.
  optional string label = 4;
}

// Where the metric is measured from.
enum ArmOrigin {
  // Omitted. Treated as `CURRENT`, which is what a trial wants and what every
  // caller that does not think about it should get.
  ARM_ORIGIN_UNSPECIFIED = 0;
  // Displacement and distance are zero at the arm point.
  ARM_ORIGIN_CURRENT = 1;
  // Keep the device origin.
  ARM_ORIGIN_ABSOLUTE = 2;
}

message ArmedZones {
  optional string zone_set = 1 [json_name = "zone_set"];
  optional uint32 zone_set_version = 2 [json_name = "zone_set_version"];
  optional uint32 arm_id = 3 [json_name = "arm_id"];
  optional string label = 4;
  repeated ZoneStatus zones = 5;
}

// What a zone is doing right now.
//
// The bounds are **as armed**, in centimetres: the `$name`s resolved from the
// trial's patch and the counts the board is actually comparing against,
// converted back. Without them a UI can only draw the set as *stored*, which
// for a parameterised set is a picture of a zone that is not the one running —
// and "is the reward region where I think it is" is the question the picture
// exists to answer.
message ZoneStatus {
  string name = 1;
  bool armed = 2;
  bool fired = 3;
  bool inside = 4;
  optional double fired_at_cm = 5 [json_name = "fired_at_cm"];

  // Per axis, in the order the zone names them. An absent value is an open
  // bound — everything past the other end.
  //
  // A **resolved** bound, deliberately a different type from `ZoneBound`: what
  // is armed can no longer be a `$name`, and the type saying so is the point of
  // having types.
  repeated ResolvedBound min_cm = 6 [json_name = "min_cm"];
  repeated ResolvedBound max_cm = 7 [json_name = "max_cm"];

  // The period the metric is taken modulo, if the zone wraps.
  optional double wrap_cm = 8 [json_name = "wrap_cm"];

  ZoneMetric metric = 9;
}

// A bound that may be open, after arming resolved it.
//
// protobuf has no nullable double inside a repeated field, and a repeated
// `optional double` is not a thing, so the absence has to be carried by a
// message: `{"value": 30}` or `{}`.
message ResolvedBound {
  optional double value = 1;
}

message ValidationReport {
  bool ok = 1;

  // The first thing wrong, in the words the compiler would use. Absent when it
  // compiles.
  optional string problem = 2;

  uint32 zone_count = 3 [json_name = "zone_count"];

  // The calibration it was compiled against, so a report is readable a day
  // later without guessing which one was in force.
  double counts_per_cm = 4 [json_name = "counts_per_cm"];

  // The `$name`s this set still needs at arm time.
  repeated string references = 5;
}

// Each rpc has its own request message, even where it carries nothing today.
//
// `google.protobuf.Empty` would say the same thing and close the door: a field
// cannot be added to it later, so an rpc that grows an argument would need a
// new rpc. `contracts/INTERACTIONS.md` §11 promises additive change within a
// major version, and this is what keeps that promise available.

message ListZoneSetsRequest {}

message ReadZoneSetSchemaRequest {}

message ReadArmedRequest {}

message DisarmRequest {}

message SaveToFlashRequest {}
