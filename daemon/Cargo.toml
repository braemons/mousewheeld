[package]
name = "mousewheeld"
description = "The locomotion input of a braemons rig: a running wheel, read and published"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mousewheeld"
path = "src/main.rs"

[dependencies]
# vstimd's stack, deliberately: a braemons developer who has read vstimd's
# server can read this one, and the packaging is vstimd's.
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
# The zone-set file's JSON Schema (`mousewheeld schema`) is derived from the
# same types the files use, so the committed schema cannot describe another
# shape.
utoipa = { version = "5", features = ["axum_extras"] }
rust-embed = "8"
# The generated wire types and their JSON mapping. Runtime only: the generators
# live in tools/protogen, outside the workspace, and run from `make proto`.
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tonic-web = "0.14"
tonic-reflection = "0.14"
tower = "0.5"
tokio-stream = { version = "0.1", features = ["sync"] }
http = "1"
hyper = "1"
mime_guess = "2"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
rand = "0.8"
# The serial port and the pty behind the board simulator: termios, posix_openpt.
libc = "0.2"
# `_mousewheeld._tcp`, the same responder and hashing statemachined uses.
mdns-sd = "0.21.4"
sha2 = "0.11.0"

# **The one dependency on another braemons repository, and the one exception to
# "no shared code".** It is barely one: the segment layout is a contract between
# a writer and a reader, and the reader's own definition of it is the only copy
# that cannot drift — the same way `gpiochip-daqd` consumes `vtl`.
#
# Pinned to a tag rather than tracking a branch, because what this crate defines
# is a memory layout: a struct that moved under a running rig is bytes
# reinterpreted, not a field that went missing. The magic and version inside the
# segment are the runtime check for a rig where this pin lied.
vinput = { git = "https://github.com/braemons/vstimd", tag = "v0.3.0-alpha1" }

[dev-dependencies]
tempfile = "3"
